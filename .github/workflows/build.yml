name: Build

# 什么时候触发构建：
#   * 推送到 master
#   * 给 master 提 PR
#   * 推送 v* 标签（例如 v1.0.7-beta）-> 构建完成后自动发布 Release
#   * 在 Actions 页面手动点击 "Run workflow"
on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# 同一分支/标签只保留最新一次运行，旧的自动取消，省额度也免得旧结果覆盖新结果。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认最小权限；发布 Release 的 job 单独提权。
permissions:
  contents: read

jobs:
  build:
    name: Build (Forge 1.20.1 / Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.mod-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # setup-gradle 会缓存 ~/.gradle（wrapper 发行版 + Forge/Minecraft 依赖），
      # 让重复构建从下载几 GB 资源变成只做编译。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Read mod version
        id: mod-version
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building explainstone ${version}"

      # 只跑 build，不跑 runClient/runServer（需要图形环境/长期运行的进程）。
      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: List build output
        run: ls -l build/libs

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: explainstone-${{ steps.mod-version.outputs.version }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release
    needs: build
    # 只有推送标签时才发布；PR / 普通提交只做构建。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: explainstone-${{ needs.build.outputs.version }}
          path: dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.jar --clobber
          else
            gh release create "$TAG" dist/*.jar \
              --title "$TAG" \
              --generate-notes
          fi
