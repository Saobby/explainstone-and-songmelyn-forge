# Sets default memory used for gradle commands.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false


## Environment Properties

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.28
# 下限 47.1.0：1.20.1 上 Forge 官方标记的第一个 Recommended Build（也是实测能稳定跑的最低版本）。
# 更早的 47.0.x 虽然实测也能跑，但属于首个发布系列（还在 47.0.36 修 EventBus 线程 NPE 之类早期问题），不作下限。 喵
forge_version_range=[47.1,)
# 注意：1.20.1 的 javafml loader 版本只报主版本（"47"），写 [47.1,) 会把所有客户端都拒掉，
# 所以 loaderVersion 只能停在 [47,)，真正的版本下限交给上面的 forge 依赖去卡。 喵
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1


